# Hoạt hình dòng điện + đồng hồ
interval:
  - interval: 15min
    startup_delay: 25s
    then:
      - http_request.get:
          url: "http://wttr.in/?format=%t|%C"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200 || body.empty()) return;
                  std::string b = body;
                  size_t bar = b.find('|');
                  if (bar == std::string::npos) return;
                  id(wx_temp) = atoi(b.substr(0, bar).c_str());
                  std::string c = b.substr(bar + 1);
                  for (auto &ch : c) ch = tolower(ch);
                  int code = 2;                                   // mặc định: nhiều mây
                  if (c.find("rain") != std::string::npos ||
                      c.find("drizzle") != std::string::npos ||
                      c.find("shower") != std::string::npos ||
                      c.find("thunder") != std::string::npos) code = 3;
                  else if (c.find("sun") != std::string::npos ||
                           c.find("clear") != std::string::npos) code = 1;
                  id(wx_code) = code;
                  ESP_LOGI("weather", "%d C, %s -> code %d", id(wx_temp), c.c_str(), code);

  - interval: 120ms
    then:
      - lambda: |-
          const int LEN = 20;                 // chiều dài đoạn chạy dọc
          const int HLEN = 19;                // chiều dài đoạn chạy ngang
          id(anim_phase) = (id(anim_phase) + 2) % LEN;
          int p = id(anim_phase);
          auto st = [](sensor::Sensor *s){ return s->has_state() ? s->state : 0.0f; };

          auto show = [](lv_obj_t *o, bool on){
            if (on) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else    lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };

          // PV -> inverter (luôn chảy xuống khi có PV)
          float pv = st(id(pv_power));
          show(id(dot_pv), pv > 20);
          lv_obj_set_pos(id(dot_pv), 117, 158 + p);

          // Pin <-> inverter: xả = chảy sang phải, sạc = chảy sang trái
          float bp = st(id(battery_power));
          int hp = p * HLEN / LEN;
          show(id(dot_batt), bp > 20 || bp < -20);
          lv_obj_set_pos(id(dot_batt), bp < 0 ? (68 + hp) : (87 - hp), 203);

          // lưới <-> inverter (hàng giữa, bên phải): mua = chảy sang trái, bán = sang phải
          float gp = st(id(grid_power));
          show(id(dot_grid), gp > 20 || gp < -20);
          lv_obj_set_pos(id(dot_grid), gp > 0 ? (172 - hp) : (153 + hp), 203);

          // inverter -> nhà (dưới cùng): luôn chảy xuống khi có tải
          float ld = st(id(load_power));
          show(id(dot_home), ld > 20);
          lv_obj_set_pos(id(dot_home), 117, 232 + p);

  - interval: 1s
    then:
      - lambda: |-
          // ---- Trang chờ: đồng hồ LED 7 thanh + ngày dương/âm ----
          {
            auto t = id(sntp_time).now();
            if (t.is_valid()) {
              // bit: a=0 b=1 c=2 d=3 e=4 f=5 g=6
              lv_obj_t *HM[4][7] = {
                {id(s0a),id(s0b),id(s0c),id(s0d),id(s0e),id(s0f),id(s0g)},
                {id(s1a),id(s1b),id(s1c),id(s1d),id(s1e),id(s1f),id(s1g)},
                {id(s2a),id(s2b),id(s2c),id(s2d),id(s2e),id(s2f),id(s2g)},
                {id(s3a),id(s3b),id(s3c),id(s3d),id(s3e),id(s3f),id(s3g)}};
              lv_obj_t *SS[2][7] = {
                {id(t0a),id(t0b),id(t0c),id(t0d),id(t0e),id(t0f),id(t0g)},
                {id(t1a),id(t1b),id(t1c),id(t1d),id(t1e),id(t1f),id(t1g)}};
              auto draw = [](lv_obj_t **seg, int val, uint32_t on) {
                uint8_t m = SEG_TBL[val % 10];
                for (int i = 0; i < 7; i++)
                  lv_obj_set_style_bg_color(seg[i],
                      lv_color_hex(((m >> i) & 1) ? on : 0x14202B), 0);
              };
              int hh = t.hour, mi = t.minute, ss = t.second;
              draw(HM[0], hh / 10, 0x33E0FF);
              draw(HM[1], hh % 10, 0x33E0FF);
              draw(HM[2], mi / 10, 0x33E0FF);
              draw(HM[3], mi % 10, 0x33E0FF);
              draw(SS[0], ss / 10, 0xFFC107);
              draw(SS[1], ss % 10, 0xFFC107);
              // hai chấm nhấp nháy mỗi giây
              uint32_t cc = (ss % 2) ? 0x14202B : 0x33E0FF;
              lv_obj_set_style_bg_color(id(col0), lv_color_hex(cc), 0);
              lv_obj_set_style_bg_color(id(col1), lv_color_hex(cc), 0);

              // thứ trong tuần
              static const char *DOW[] = {"SUN","MON","TUE","WED","THU","FRI","SAT"};
              int dw = t.day_of_week - 1;
              if (dw < 0 || dw > 6) dw = 0;
              lv_label_set_text(id(i_dow), DOW[dw]);

              // icon thời tiết suy từ công suất PV
              {
                bool sunny, cloudy, rainy = false;
                if (id(wx_code) > 0) {                 // có dữ liệu từ internet
                  sunny  = id(wx_code) == 1;
                  cloudy = id(wx_code) == 2;
                  rainy  = id(wx_code) == 3;
                } else {                               // chưa có -> suy từ PV
                  float pvw = id(pv_power).has_state() ? id(pv_power).state : 0.0f;
                  sunny  = pvw > 800.0f;
                  cloudy = pvw > 50.0f && pvw <= 800.0f;
                }
                auto vis = [](lv_obj_t *o, bool on) {
                  if (on) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
                  else    lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
                };
                vis(id(w_r1), sunny); vis(id(w_r2), sunny);
                vis(id(w_r3), sunny); vis(id(w_r4), sunny);
                vis(id(w_c1), cloudy || rainy);
                vis(id(w_c2), cloudy || rainy);
                vis(id(w_c3), cloudy || rainy);
                vis(id(w_d1), rainy); vis(id(w_d2), rainy); vis(id(w_d3), rainy);
                lv_obj_set_style_bg_color(id(w_disc),
                    lv_color_hex(sunny ? 0xFFC107 : (cloudy ? 0xD8A200 : 0x5A6B7D)), 0);
                if (id(wx_code) > 0)
                  lv_label_set_text(id(i_temp), str_sprintf("%d C", id(wx_temp)).c_str());
              }

              lv_label_set_text(id(i_date),
                  str_sprintf("%02d/%02d/%04d", t.day_of_month, t.month, t.year).c_str());
              int ld, lm, ly, leap;
              vnlunar::solar_to_lunar(t.day_of_month, t.month, t.year, ld, lm, ly, leap);
              lv_label_set_text(id(i_lunar),
                  str_sprintf("AL %d/%d%s  %s", ld, lm, leap ? "N" : "",
                              vnlunar::can_chi(ly).c_str()).c_str());
            }
          }

          // ---- Làm nổi bật nút có công suất lớn nhất ----
          auto ab = [](sensor::Sensor *se){ float v = se->has_state() ? se->state : 0.0f;
                                            return v < 0 ? -v : v; };
          float p_pv = ab(id(pv_power));
          float p_bt = ab(id(battery_power));
          float p_gd = ab(id(grid_power));
          float p_hm = ab(id(load_power));
          float mx = p_pv;
          if (p_bt > mx) mx = p_bt;
          if (p_gd > mx) mx = p_gd;
          if (p_hm > mx) mx = p_hm;
          auto hl = [](lv_obj_t *box, lv_obj_t *lbl, bool on){
            lv_obj_set_style_border_width(box, on ? 4 : 2, 0);
            lv_obj_set_style_text_color(lbl,
                lv_color_hex(on ? 0xFFFFFF : 0x8A9BB4), 0);
          };
          bool any = mx > 20.0f;
          hl(id(box_pv),   id(lbl_pv),   any && p_pv >= mx);
          hl(id(box_batt), id(lbl_batt), any && p_bt >= mx);
          hl(id(box_grid), id(lbl_grid), any && p_gd >= mx);
          hl(id(box_home), id(lbl_home), any && p_hm >= mx);

          auto t = id(sntp_time).now();
          std::string s = t.is_valid() ? str_sprintf("%02d:%02d", t.hour, t.minute)
                                       : std::string("--:--");
          lv_label_set_text(id(lbl_clock), s.c_str());
          lv_label_set_text(id(lbl_clock2), s.c_str());
