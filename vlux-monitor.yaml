            widgets:
              - label:
                  text: "Chi tiet"
                  text_color: ${col_text}
                  text_font: montserrat_14
                  align: LEFT_MID
                  x: 6
              - label:
                  id: lbl_clock2
                  text: "--:--"
                  text_color: ${col_muted}
                  text_font: montserrat_14
                  align: RIGHT_MID
                  x: -6

        - obj:
            styles: card_sm
            x: 10
            y: 30
            width: 108
            height: 56
            widgets:
              - label:
                  text: "GRID V"
                  text_color: ${col_grid}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_gv
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_18
                  align: BOTTOM_RIGHT
        - obj:
            styles: card_sm
            x: 122
            y: 30
            width: 108
            height: 56
            widgets:
              - label:
                  text: "GRID Hz"
                  text_color: ${col_grid}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_gf
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_18
                  align: BOTTOM_RIGHT

        - obj:
            styles: card_sm
            x: 10
            y: 92
            width: 108
            height: 56
            widgets:
              - label:
                  text: "PV1"
                  text_color: ${col_pv}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_pv1
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_18
                  align: BOTTOM_RIGHT
        - obj:
            styles: card_sm
            x: 122
            y: 92
            width: 108
            height: 56
            widgets:
              - label:
                  text: "PV2"
                  text_color: ${col_pv}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_pv2
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_18
                  align: BOTTOM_RIGHT

        - obj:
            styles: card_sm
            x: 10
            y: 154
            width: 108
            height: 56
            widgets:
              - label:
                  text: "IMPORT"
                  text_color: ${col_grid}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_imp
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_16
                  align: BOTTOM_RIGHT
        - obj:
            styles: card_sm
            x: 122
            y: 154
            width: 108
            height: 56
            widgets:
              - label:
                  text: "EXPORT"
                  text_color: ${col_pv}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_exp
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_16
                  align: BOTTOM_RIGHT

        - obj:
            styles: card_sm
            x: 10
            y: 216
