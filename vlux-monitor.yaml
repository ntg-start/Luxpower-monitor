# ============================================================================
#  VLux-Monitor  —  ESPHome cho CYD 2.8" (ESP32-2432S028R)
#  Dongle Luxpower qua TCP (component luxpower_tcp) + UI LVGL 2 trang
#  Chạm vào màn hình để chuyển trang.
# ============================================================================

substitutions:
  name: vlux-monitor
  friendly_name: "VLux-Monitor"
  # ---- Bảng màu (đổi ở đây để đổi toàn bộ theme) ----
  col_bg:      "0x0B1220"   # nền
  col_card:    "0x182235"   # thẻ
  col_card2:   "0x1F2C44"   # thẻ phụ / rãnh arc
  col_pv:      "0x22C55E"   # xanh lá  - PV
  col_grid:    "0xF59E0B"   # cam      - lưới
  col_load:    "0x38BDF8"   # xanh dương - tải
  col_batt:    "0xA78BFA"   # tím      - pin
  col_text:    "0xF1F5F9"   # chữ chính
  col_muted:   "0x8A9BB4"   # chữ phụ
  col_bad:     "0xEF4444"   # đỏ - mất kết nối

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on: backlight

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

# ----------------------------------------------------------------------------
#  WiFi + Captive portal (độc lập, không cần Home Assistant)
# ----------------------------------------------------------------------------
wifi:
  ap:
    ssid: ${friendly_name}
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  log: false          # tắt stream log -> nhẹ tài nguyên
  auth:
    type: basic
    username: !secret web_user
    password: !secret web_password

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Ho_Chi_Minh

# ----------------------------------------------------------------------------
#  Màn hình ILI9341 + cảm ứng XPT2046 (CYD dùng 2 bus SPI riêng)
# ----------------------------------------------------------------------------
spi:
  - id: tft_bus
    clk_pin: 14
    mosi_pin: 13
    miso_pin: 12
  - id: touch_bus
    clk_pin: 25
    mosi_pin: 32
    miso_pin: 39

output:
  - platform: ledc
    pin: 21
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    model: ESP32-2432S028-7789   # CYD bản USB-C + Micro-USB -> chip ST7789V
    id: main_display
    spi_id: tft_bus
    auto_clear_enabled: false
    update_interval: never     # LVGL điều khiển vẽ
    # Nếu màu âm bản: thêm  invert_colors: true
    # Nếu ảnh bị lật:  thêm  transform: {mirror_x: true}  hoặc mirror_y

touchscreen:
  - platform: xpt2046
    id: main_touch
    spi_id: touch_bus
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 50ms
    threshold: 400
    calibration:              # chỉnh nếu chạm lệch
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false      # không xoay màn
      mirror_x: false
      mirror_y: false

# ----------------------------------------------------------------------------
#  Dữ liệu từ dongle Luxpower
# ----------------------------------------------------------------------------
luxpower_tcp:
  id: lux
  port: 8000                 # xác nhận từ firmware gốc (DAT_400d0538 = 0x1F40)
  update_interval: 3s
  # host / dongle_serial / inverter_serial đều KHÔNG bắt buộc:
  #   - bỏ trống  -> tự quét LAN tìm dongle, tự học 2 serial từ frame dongle đẩy ra,
  #                  rồi nhớ vào flash cho lần sau (giống firmware gốc)
  #   - điền vào  -> dùng thẳng, bỏ qua bước dò (nhanh hơn)
  # host: 192.168.1.50
  # dongle_serial: "BA12345678"
  # inverter_serial: "1234567890"

  dongle_ip_text:
    name: "Dongle IP"
    id: t_ip
    on_value:
      - lvgl.label.update:
          id: d_ip
          text: !lambda 'return x;'
  dongle_sn_text:
    name: "Dongle SN"
    id: t_dsn
    on_value:
      - lvgl.label.update:
          id: d_dsn
          text: !lambda 'return x;'
  inverter_sn_text:
    name: "Inverter SN"
    id: t_isn
    on_value:
      - lvgl.label.update:
          id: d_isn
          text: !lambda 'return x;'

  online:
    name: "Dongle Online"
    id: dongle_online
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.label.update:
                id: lbl_link
                text: "LIVE"
                text_color: ${col_pv}
          else:
            - lvgl.label.update:
                id: lbl_link
                text: "OFFLINE"
                text_color: ${col_bad}

  pv_power:
    name: "PV Power"
    id: pv_power
    on_value:
      - lambda: 'id(last_data_ms) = millis();'
      - lvgl.label.update:
          id: lbl_pv
          text: !lambda 'return str_sprintf("%.2f kW", x / 1000.0f);'
  battery_soc:
    name: "Battery SOC"
    id: battery_soc
  battery_voltage:
    name: "Battery Voltage"
    id: battery_voltage
    on_value:
      - lvgl.label.update:
          id: d_vbat
          text: !lambda 'return str_sprintf("%.1f V", x);'
  battery_power:
    name: "Battery Power"
    id: battery_power
    on_value:
      - lvgl.label.update:
          id: lbl_batt
          text: !lambda |-
            float a = x < 0 ? -x : x;
            return (a >= 1000.0f) ? str_sprintf("%+.2f kW", x / 1000.0f)
                                  : str_sprintf("%+.0f W", x);
      - lvgl.label.update:
          id: lbl_batt_sub
          text: !lambda |-
            int soc = id(battery_soc).has_state() ? (int) id(battery_soc).state : 0;
            const char *st = (x > 20) ? "CHARGE" : ((x < -20) ? "DISCHG" : "IDLE");
            return str_sprintf("%d%% %s", soc, st);
  grid_power:
    name: "Grid Power"
    id: grid_power
    on_value:
      - lvgl.label.update:
          id: lbl_grid
          text: !lambda 'return str_sprintf("%.0f W", x);'
  load_power:
    name: "Load Power"
    id: load_power
    on_value:
      - lvgl.label.update:
          id: lbl_home
          text: !lambda |-
            return (x >= 1000.0f) ? str_sprintf("%.2f kW", x / 1000.0f)
                                  : str_sprintf("%.0f W", x);
  grid_voltage:
    name: "Grid Voltage"
    id: grid_voltage
    on_value:
      - lvgl.label.update:
          id: d_gv
          text: !lambda 'return str_sprintf("%.1f V", x);'
  grid_freq:
    name: "Grid Frequency"
    id: grid_freq
    on_value:
      - lvgl.label.update:
          id: d_gf
          text: !lambda 'return str_sprintf("%.2f Hz", x);'
      - lvgl.label.update:
          id: lbl_grid_sub
          text: !lambda |-
            float v = id(grid_voltage).has_state() ? id(grid_voltage).state : 0.0f;
            return str_sprintf("%.0fV %.0fHz", v, x);
  pv_today:
    name: "PV Today"
    id: pv_today
    on_value:
      - script.execute: upd_donuts
  pv1_power:
    name: "PV1 Power"
    id: pv1_power
    on_value:
      - lvgl.label.update:
          id: d_pv1
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.label.update:
          id: lbl_pv12
          text: !lambda |-
            float p2 = id(pv2_power).has_state() ? id(pv2_power).state : 0.0f;
            return str_sprintf("PV1 %.0f W    PV2 %.0f W", x, p2);
  pv2_power:
    name: "PV2 Power"
    id: pv2_power
    on_value:
      - lvgl.label.update:
          id: d_pv2
          text: !lambda 'return str_sprintf("%.0f W", x);'
  charge_today:
    name: "Charge Today"
    id: charge_today
    on_value:
      - script.execute: upd_donuts
  discharge_today:
    name: "Discharge Today"
    id: discharge_today
    on_value:
      - script.execute: upd_donuts
  grid_import_today:
    name: "Grid Import Today"
    id: grid_import_today
    on_value:
      - lvgl.label.update:
          id: d_imp
          text: !lambda 'return str_sprintf("%.1f kWh", x);'
      - script.execute: upd_donuts
  grid_export_today:
    name: "Grid Export Today"
    id: grid_export_today
    on_value:
      - lvgl.label.update:
          id: d_exp
          text: !lambda 'return str_sprintf("%.1f kWh", x);'
      - script.execute: upd_donuts
  frames_total:
    name: "Data Frames"
    id: frames_total
  temp_radiator:
    name: "Radiator Temp"
    id: temp_radiator
  temp_inner:
    name: "Inverter Temp"
    id: temp_inner
    on_value:
      - script.execute: upd_donuts
      - lvgl.label.update:
          id: d_temp
          text: !lambda 'return str_sprintf("%.0f C", x);'
      - lvgl.label.update:
          id: lbl_inv_sub
          text: !lambda |-
            float r = id(temp_radiator).has_state() ? id(temp_radiator).state : 0.0f;
            return str_sprintf("DC %.0f  AC %.0f", x, r);

number:
  - platform: template
    name: "Reconnect gap ms"
    id: num_gap
    optimistic: true
    min_value: 200
    max_value: 30000
    step: 100
    initial_value: 1000
    restore_value: true
    set_action:
      - lambda: 'id(lux)->set_reconnect_gap((uint32_t) x);'

script:
  - id: upd_donuts
    then:
      - lambda: |-
          auto g = [](sensor::Sensor *s){ return s->has_state() ? s->state : 0.0f; };
          float pv  = g(id(pv_today));
          float dis = g(id(discharge_today));
          float chg = g(id(charge_today));
          float imp = g(id(grid_import_today));
          float exp_= g(id(grid_export_today));
          float prod = pv + dis;                       // sản xuất = PV + xả pin
          float load = pv + dis + imp - chg - exp_;    // tải = cân bằng năng lượng
          if (load < 0) load = 0;
          float cons = chg + load;                     // tiêu thụ = sạc pin + tải
          int pvp  = prod > 0.05f ? (int) (pv  * 100.0f / prod + 0.5f) : 0;
          int pinp = cons > 0.05f ? (int) (chg * 100.0f / cons + 0.5f) : 0;
          lv_label_set_text(id(lbl_prod), str_sprintf("%.1f", prod).c_str());
          lv_label_set_text(id(lbl_prod_sub),
              str_sprintf("PV %d%%  BAT %d%%", pvp, 100 - pvp).c_str());
          lv_arc_set_value(id(arc_prod), pvp);
          lv_label_set_text(id(lbl_cons), str_sprintf("%.1f", cons).c_str());
          lv_label_set_text(id(lbl_cons_sub),
              str_sprintf("BAT %d%%  LOAD %d%%", pinp, 100 - pinp).c_str());
          lv_arc_set_value(id(arc_cons), pinp);

globals:
  - id: anim_phase
    type: int
    initial_value: '0'
  - id: last_data_ms
    type: uint32_t
    initial_value: '0'

binary_sensor:
  - platform: status
    name: "Device Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      id: wifi_ip
      on_value:
        - lvgl.label.update:
            id: d_wifi
            text: !lambda 'return std::string("WiFi: ") + x;'

# ----------------------------------------------------------------------------
#  Giao diện LVGL — 2 trang, chạm để chuyển
# ----------------------------------------------------------------------------
lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  # KHÔNG xoay: panel CYD 2.8" là khổ dọc 240x320 (xoay bằng phần mềm làm chữ dựng đứng)
  bg_color: ${col_bg}

  style_definitions:
    - id: card
      bg_color: ${col_card}
      bg_opa: COVER
      radius: 12
      border_width: 0
      pad_all: 6
      text_color: ${col_text}
    - id: card_sm
      bg_color: ${col_card}
      bg_opa: COVER
      radius: 10
      border_width: 0
      pad_all: 5
      text_color: ${col_text}
    - id: topbar
      bg_color: ${col_card2}
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0

  pages:
    # ======================= TRANG 1: DONUT + POWER FLOW =======================
    - id: page_main
      bg_color: ${col_bg}
      widgets:
        # ---------- Donut PRODUCTION ----------
        - obj:
            x: 4
            y: 3
            width: 114
            height: 86
            radius: 10
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 0
            pad_all: 2
            widgets:
              - label:
                  text: "PRODUCTION"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - arc:
                  id: arc_prod
                  align: TOP_MID
                  y: 11
                  width: 52
                  height: 52
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_width: 7
                  arc_color: ${col_grid}
                  indicator:
                    arc_color: ${col_pv}
                    arc_width: 7
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: lbl_prod
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_16
                  align: TOP_MID
                  y: 25
              - label:
                  text: "kWh"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
                  y: 43
              - label:
                  id: lbl_prod_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        # ---------- Donut CONSUMPTION ----------
        - obj:
            x: 122
            y: 3
            width: 114
            height: 86
            radius: 10
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 0
            pad_all: 2
            widgets:
              - label:
                  text: "CONSUMPTION"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - arc:
                  id: arc_cons
                  align: TOP_MID
                  y: 11
                  width: 52
                  height: 52
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_width: 7
                  arc_color: ${col_load}
                  indicator:
                    arc_color: ${col_grid}
                    arc_width: 7
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: lbl_cons
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_16
                  align: TOP_MID
                  y: 25
              - label:
                  text: "kWh"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
                  y: 43
              - label:
                  id: lbl_cons_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        # ---------- TOTAL PV ----------
        - obj:
            id: box_pv
            x: 58
            y: 96
            width: 124
            height: 46
            radius: 8
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_pv}
            pad_all: 2
            widgets:
              - label:
                  text: "TOTAL PV"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - label:
                  id: lbl_pv
                  text: "-- kW"
                  text_color: ${col_text}
                  text_font: montserrat_18
                  align: CENTER
                  y: 2
              - label:
                  id: lbl_mppt
                  text: "2 MPPT"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        - label:
            id: lbl_pv12
            text: "PV1 -- W    PV2 -- W"
            text_color: ${col_pv}
            text_font: montserrat_10
            align: TOP_MID
            y: 144

        # ---------- duong noi doc PV -> inverter (dai de chay hoat hinh) ----------
        - obj:
            x: 119
            y: 158
            width: 2
            height: 20
            bg_color: ${col_card2}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
        - obj:
            id: dot_pv
            x: 117
            y: 158
            width: 6
            height: 6
            radius: 3
            bg_color: ${col_pv}
            bg_opa: COVER
            border_width: 0
            pad_all: 0

        # ---------- BATTERY | Luxpower | HOME ----------
        - obj:
            id: box_batt
            x: 2
            y: 180
            width: 66
            height: 52
            radius: 8
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_grid}
            pad_all: 2
            widgets:
              - label:
                  text: "BATTERY"
                  text_color: ${col_grid}
                  text_font: montserrat_10
                  align: TOP_MID
              - label:
                  id: lbl_batt
                  text: "--"
                  text_color: ${col_grid}
                  text_font: montserrat_14
                  align: CENTER
              - label:
                  id: lbl_batt_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID
        - obj:
            x: 87
            y: 180
            width: 66
            height: 52
            radius: 8
            bg_color: ${col_card2}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_load}
            pad_all: 2
            widgets:
              - label:
                  text: "LUX"
                  text_color: ${col_load}
                  text_font: montserrat_14
                  align: TOP_MID
              - label:
                  id: lbl_inv_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: CENTER
                  y: 6
        - obj:
            id: box_grid
            x: 172
            y: 180
            width: 66
            height: 52
            radius: 8
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_muted}
            pad_all: 2
            widgets:
              - label:
                  text: "GRID"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - label:
                  id: lbl_grid
                  text: "-- W"
                  text_color: ${col_text}
                  text_font: montserrat_14
                  align: CENTER
              - label:
                  id: lbl_grid_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        # ---------- duong noi ngang ----------
        - obj:
            x: 68
            y: 205
            width: 19
            height: 2
            bg_color: ${col_card2}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
        - obj:
            id: dot_batt
            x: 68
            y: 203
            width: 6
            height: 6
            radius: 3
            bg_color: ${col_grid}
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - obj:
            x: 153
            y: 205
            width: 19
            height: 2
            bg_color: ${col_card2}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
        - obj:
            id: dot_home
            x: 153
            y: 203
            width: 6
            height: 6
            radius: 3
            bg_color: ${col_bad}
            bg_opa: COVER
            border_width: 0
            pad_all: 0

        # ---------- duong noi xuong GRID ----------
        - obj:
            x: 119
            y: 232
            width: 2
            height: 20
            bg_color: ${col_card2}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
        - obj:
            id: dot_grid
            x: 117
            y: 232
            width: 6
            height: 6
            radius: 3
            bg_color: ${col_grid}
            bg_opa: COVER
            border_width: 0
            pad_all: 0

        # ---------- GRID ----------
        - obj:
            id: box_home
            x: 58
            y: 252
            width: 124
            height: 44
            radius: 8
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_bad}
            pad_all: 2
            widgets:
              - label:
                  text: "HOME"
                  text_color: ${col_bad}
                  text_font: montserrat_10
                  align: TOP_MID
              - label:
                  id: lbl_home
                  text: "--"
                  text_color: ${col_bad}
                  text_font: montserrat_16
                  align: CENTER
              - label:
                  text: "ESSENTIAL"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        - label:
            id: lbl_link
            text: ""
            text_color: ${col_muted}
            text_font: montserrat_10
            align: BOTTOM_LEFT
            x: 6
            y: -2
        - label:
            id: lbl_clock
            text: "--:--"
            text_color: ${col_muted}
            text_font: montserrat_10
            align: BOTTOM_RIGHT
            x: -6
            y: -2

        - obj:
            x: 0
            y: 0
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: true
            on_click:
              - lvgl.page.next:
    # ======================= TRANG 2: CHI TIẾT =======================
    - id: page_detail
      bg_color: ${col_bg}
      widgets:
        - obj:
            styles: topbar
            x: 0
            y: 0
            width: 240
            height: 24
            widgets:
              - label:
                  text: "Chi tiet"
                  text_color: ${col_text}
                  text_font: montserrat_14
                  align: LEFT_MID
                  x: 6
              - label:
                  id: lbl_clock2
                  text: "--:--"
                  text_color: ${col_muted}
                  text_font: montserrat_14
                  align: RIGHT_MID
                  x: -6

        - obj:
            styles: card_sm
            x: 10
            y: 30
            width: 108
            height: 56
            widgets:
              - label:
                  text: "GRID V"
                  text_color: ${col_grid}
