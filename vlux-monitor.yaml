# ============================================================================
#  VLux-Monitor  —  ESPHome cho CYD 2.8" (ESP32-2432S028R)
#  Dongle Luxpower qua TCP (component luxpower_tcp) + UI LVGL 2 trang
#  Chạm vào màn hình để chuyển trang.
# ============================================================================

substitutions:
  name: vlux-monitor
  friendly_name: "VLux-Monitor"
  # ---- Bảng màu (đổi ở đây để đổi toàn bộ theme) ----
  col_bg:      "0x0B1220"   # nền
  col_card:    "0x182235"   # thẻ
  col_card2:   "0x1F2C44"   # thẻ phụ / rãnh arc
  col_pv:      "0x22C55E"   # xanh lá  - PV
  col_grid:    "0xF59E0B"   # cam      - lưới
  col_load:    "0x38BDF8"   # xanh dương - tải
  col_batt:    "0xA78BFA"   # tím      - pin
  col_text:    "0xF1F5F9"   # chữ chính
  col_muted:   "0x8A9BB4"   # chữ phụ
  col_bad:     "0xEF4444"   # đỏ - mất kết nối
  col_ok:      "0x22C55E"   # xanh - thành công
  # Đưa mật khẩu vào dạng text để trang Cài đặt hiển thị được.
  # (lambda là chuỗi thuần, không dùng được !secret trực tiếp bên trong)
  s_ota_pw:    !secret ota_password
  s_web_user:  !secret web_user
  s_web_pw:    !secret web_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - lunar.h
  # bảng 7 thanh: bit a=0 b=1 c=2 d=3 e=4 f=5 g=6
  project:
    name: vlux.monitor
    version: "2.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on: backlight

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

# Giữ lại kết quả quét WiFi để trang Cài đặt liệt kê được SSID
vlux_settings:

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

# ----------------------------------------------------------------------------
#  WiFi + Captive portal (độc lập, không cần Home Assistant)
# ----------------------------------------------------------------------------
wifi:
  ap:
    ssid: ${friendly_name}
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  log: false          # tắt stream log -> nhẹ tài nguyên
  auth:
    type: basic
    username: !secret web_user
    password: !secret web_password

http_request:
  id: http_cli
  useragent: "esphome/vlux-monitor"
  timeout: 10s
  verify_ssl: false

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Ho_Chi_Minh

# ----------------------------------------------------------------------------
#  Màn hình ILI9341 + cảm ứng XPT2046 (CYD dùng 2 bus SPI riêng)
# ----------------------------------------------------------------------------
spi:
  - id: tft_bus
    clk_pin: 14
    mosi_pin: 13
    miso_pin: 12
  - id: touch_bus
    clk_pin: 25
    mosi_pin: 32
    miso_pin: 39

output:
  - platform: ledc
    pin: 21
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    model: ESP32-2432S028-7789   # CYD bản USB-C + Micro-USB -> chip ST7789V
    id: main_display
    spi_id: tft_bus
    auto_clear_enabled: false
    update_interval: never     # LVGL điều khiển vẽ
    # Nếu màu âm bản: thêm  invert_colors: true
    # Nếu ảnh bị lật:  thêm  transform: {mirror_x: true}  hoặc mirror_y

touchscreen:
  - platform: xpt2046
    id: main_touch
    spi_id: touch_bus
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 50ms
    threshold: 400
    calibration:              # chỉnh nếu chạm lệch
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false      # không xoay màn
      # Tấm XPT2046 trên CYD trả trục X ngược chiều với panel: chạm bên trái ra
      # toạ độ bên phải. Với nút to thì ít ai để ý, nhưng bàn phím LVGL 10 cột
      # (mỗi phím ~24px) thì sai hoàn toàn. ESPHome xử lý bằng invert_x_:
      # normalize_() lật ret = 0xfff - ret (touchscreen.cpp:160).
      mirror_x: true
      mirror_y: false
    # Cần đo lại toạ độ chạm? Bật tạm khối này rồi nạp:
    # on_touch:
    #   - logger.log:
    #       level: WARN
    #       format: "TOUCH x=%d y=%d  raw=%d,%d"
    #       args: ['touch.x', 'touch.y', 'touch.x_raw', 'touch.y_raw']

# ----------------------------------------------------------------------------
#  Dữ liệu từ dongle Luxpower
# ----------------------------------------------------------------------------
luxpower_tcp:
  id: lux
  port: 8000                 # xác nhận từ firmware gốc (DAT_400d0538 = 0x1F40)
  update_interval: 3s
  # host / dongle_serial / inverter_serial đều KHÔNG bắt buộc:
  #   - bỏ trống  -> tự quét LAN tìm dongle, tự học 2 serial từ frame dongle đẩy ra,
  #                  rồi nhớ vào flash cho lần sau (giống firmware gốc)
  #   - điền vào  -> dùng thẳng, bỏ qua bước dò (nhanh hơn)
  # host: 192.168.1.50
  # dongle_serial: "BA12345678"
  # inverter_serial: "1234567890"

  dongle_ip_text:
    name: "Dongle IP"
    id: t_ip
    on_value:
      - lvgl.label.update:
          id: d_ip
          text: !lambda 'return x;'
  dongle_sn_text:
    name: "Dongle SN"
    id: t_dsn
  inverter_sn_text:
    name: "Inverter SN"
    id: t_isn

  online:
    name: "Dongle Online"
    id: dongle_online
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.label.update:
                id: lbl_link
                text: "LIVE"
                text_color: ${col_pv}
          else:
            - lvgl.label.update:
                id: lbl_link
                text: "OFFLINE"
                text_color: ${col_bad}

  pv_power:
    name: "PV Power"
    id: pv_power
    on_value:
      - lambda: 'id(last_data_ms) = millis();'
      - lvgl.label.update:
          id: lbl_pv
          text: !lambda 'return str_sprintf("%.2f kW", x / 1000.0f);'
      - lvgl.label.update:
          id: i_pv
          text: !lambda |-
            return (x >= 1000.0f) ? str_sprintf("%.2f kW", x / 1000.0f)
                                  : str_sprintf("%.0f W", x);
  battery_soc:
    name: "Battery SOC"
    id: battery_soc
    on_value:
      - lvgl.label.update:
          id: i_batt
          text: !lambda 'return str_sprintf("%.0f%%", x);'
  battery_voltage:
    name: "Battery Voltage"
    id: battery_voltage
    on_value:
      - lvgl.label.update:
          id: d_vbat
          text: !lambda 'return str_sprintf("%.1f V", x);'
  battery_power:
    name: "Battery Power"
    id: battery_power
    on_value:
      - lvgl.label.update:
          id: lbl_batt
          text: !lambda |-
            float a = x < 0 ? -x : x;
            return (a >= 1000.0f) ? str_sprintf("%+.2f kW", x / 1000.0f)
                                  : str_sprintf("%+.0f W", x);
      - lvgl.label.update:
          id: lbl_batt_sub
          text: !lambda |-
            int soc = id(battery_soc).has_state() ? (int) id(battery_soc).state : 0;
            const char *st = (x > 20) ? "CHARGE" : ((x < -20) ? "DISCHG" : "IDLE");
            return str_sprintf("%d%% %s", soc, st);
  grid_power:
    name: "Grid Power"
    id: grid_power
    on_value:
      - lvgl.label.update:
          id: lbl_grid
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.label.update:
          id: i_grid
          text: !lambda |-
            float a = x < 0 ? -x : x;
            return (a >= 1000.0f) ? str_sprintf("%.2f kW", x / 1000.0f)
                                  : str_sprintf("%.0f W", x);
  load_power:
    name: "Load Power"
    id: load_power
    on_value:
      - lvgl.label.update:
          id: lbl_home
          text: !lambda |-
            return (x >= 1000.0f) ? str_sprintf("%.2f kW", x / 1000.0f)
                                  : str_sprintf("%.0f W", x);
      - lvgl.label.update:
          id: i_home
          text: !lambda |-
            return (x >= 1000.0f) ? str_sprintf("%.2f kW", x / 1000.0f)
                                  : str_sprintf("%.0f W", x);
  grid_voltage:
    name: "Grid Voltage"
    id: grid_voltage
    on_value:
      - lvgl.label.update:
          id: d_gv
          text: !lambda 'return str_sprintf("%.1f V", x);'
  grid_freq:
    name: "Grid Frequency"
    id: grid_freq
    on_value:
      - lvgl.label.update:
          id: d_gf
          text: !lambda 'return str_sprintf("%.2f Hz", x);'
      - lvgl.label.update:
          id: lbl_grid_sub
          text: !lambda |-
            float v = id(grid_voltage).has_state() ? id(grid_voltage).state : 0.0f;
            return str_sprintf("%.0fV %.0fHz", v, x);
  pv_today:
    name: "PV Today"
    id: pv_today
    on_value:
      - script.execute: upd_donuts
  pv1_power:
    name: "PV1 Power"
    id: pv1_power
    on_value:
      - lvgl.label.update:
          id: d_pv1
          text: !lambda 'return str_sprintf("%.0f W", x);'
      - lvgl.label.update:
          id: lbl_pv12
          text: !lambda |-
            float p2 = id(pv2_power).has_state() ? id(pv2_power).state : 0.0f;
            return str_sprintf("PV1 %.0f W    PV2 %.0f W", x, p2);
  pv2_power:
    name: "PV2 Power"
    id: pv2_power
    on_value:
      - lvgl.label.update:
          id: d_pv2
          text: !lambda 'return str_sprintf("%.0f W", x);'
  charge_today:
    name: "Charge Today"
    id: charge_today
    on_value:
      - script.execute: upd_donuts
  discharge_today:
    name: "Discharge Today"
    id: discharge_today
    on_value:
      - script.execute: upd_donuts
  grid_import_today:
    name: "Grid Import Today"
    id: grid_import_today
    on_value:
      - lvgl.label.update:
          id: d_imp
          text: !lambda 'return str_sprintf("%.1f kWh", x);'
      - script.execute: upd_donuts
  grid_export_today:
    name: "Grid Export Today"
    id: grid_export_today
    on_value:
      - lvgl.label.update:
          id: d_exp
          text: !lambda 'return str_sprintf("%.1f kWh", x);'
      - script.execute: upd_donuts
  frames_total:
    name: "Data Frames"
    id: frames_total
  temp_radiator:
    name: "Radiator Temp"
    id: temp_radiator
  temp_inner:
    name: "Inverter Temp"
    id: temp_inner
    on_value:
      - script.execute: upd_donuts
      - lvgl.label.update:
          id: d_temp
          text: !lambda 'return str_sprintf("%.0f C", x);'
      - lvgl.label.update:
          id: lbl_inv_sub
          text: !lambda |-
            float r = id(temp_radiator).has_state() ? id(temp_radiator).state : 0.0f;
            return str_sprintf("DC %.0f  AC %.0f", x, r);

number:
  - platform: template
    name: "Reconnect gap ms"
    id: num_gap
    optimistic: true
    min_value: 200
    max_value: 30000
    step: 100
    initial_value: 1000
    restore_value: true
    set_action:
      - lambda: 'id(lux)->set_reconnect_gap((uint32_t) x);'

script:
  - id: upd_donuts
    then:
      - lambda: |-
          auto g = [](sensor::Sensor *s){ return s->has_state() ? s->state : 0.0f; };
          float pv  = g(id(pv_today));
          float dis = g(id(discharge_today));
          float chg = g(id(charge_today));
          float imp = g(id(grid_import_today));
          float exp_= g(id(grid_export_today));
          float prod = pv + dis;                       // sản xuất = PV + xả pin
          float load = pv + dis + imp - chg - exp_;    // tải = cân bằng năng lượng
          if (load < 0) load = 0;
          float cons = chg + load;                     // tiêu thụ = sạc pin + tải
          int pvp  = prod > 0.05f ? (int) (pv  * 100.0f / prod + 0.5f) : 0;
          int pinp = cons > 0.05f ? (int) (chg * 100.0f / cons + 0.5f) : 0;
          lv_label_set_text(id(lbl_prod), str_sprintf("%.1f", prod).c_str());
          lv_label_set_text(id(lbl_prod_sub),
              str_sprintf("PV %d%%  BAT %d%%", pvp, 100 - pvp).c_str());
          lv_arc_set_value(id(arc_prod), pvp);
          lv_label_set_text(id(lbl_cons), str_sprintf("%.1f", cons).c_str());
          lv_label_set_text(id(lbl_cons_sub),
              str_sprintf("BAT %d%%  LOAD %d%%", pinp, 100 - pinp).c_str());
          lv_arc_set_value(id(arc_cons), pinp);

  # ---- Trang Cài đặt: nạp giá trị hiện tại vào các nhãn ----
  - id: fill_settings
    then:
      - lambda: |-
          auto txt = [](text_sensor::TextSensor *s) -> std::string {
            return (s != nullptr && s->has_state() && !s->state.empty())
                     ? s->state : std::string("--");
          };
          lv_label_set_text(id(s_ip_dev),    txt(id(wifi_ip)).c_str());
          lv_label_set_text(id(s_ssid_cur),  txt(id(wifi_ssid)).c_str());
          lv_label_set_text(id(s_ip_dongle), txt(id(t_ip)).c_str());
          lv_label_set_text(id(s_sn_dongle), txt(id(t_dsn)).c_str());
          lv_label_set_text(id(s_devid),     vlux_settings::device_id().c_str());
          bool show = id(show_secrets);
          lv_label_set_text(id(s_web),
              show ? "${s_web_user} / ${s_web_pw}" : "${s_web_user} / ********");
          lv_label_set_text(id(s_ota), show ? "${s_ota_pw}" : "********");

  # ---- Trang WiFi: nạp danh sách SSID từ lần quét gần nhất ----
  - id: fill_wifi_list
    then:
      - lambda: |-
          // dropdown là widget "compound": id() trả về LvDropdownType*, lv_obj_t
          // nằm ở thành viên ->obj (khác label, id() trả thẳng lv_obj_t*)
          lv_dropdown_set_options(id(dd_ssid)->obj, vlux_settings::ssid_options().c_str());
          lv_dropdown_set_selected(id(dd_ssid)->obj, 0);
          lv_label_set_text(id(lbl_wifi_msg),
              vlux_settings::ssid_count() == 0
                ? "Chua co ket qua quet - bam QUET LAI"
                : "Chon mang roi nhap mat khau");

globals:
  # 0 = chua co du lieu (dung PV suy ra), 1 = nang, 2 = nhieu may, 3 = mua
  - id: wx_code
    type: int
    initial_value: '0'
  - id: wx_temp
    type: int
    initial_value: '0'
  - id: anim_phase
    type: int
    initial_value: '0'
  - id: last_data_ms
    type: uint32_t
    initial_value: '0'
  # Trang Cài đặt: mật khẩu che mặc định, chạm để hiện
  - id: show_secrets
    type: bool
    initial_value: 'false'
  # Lựa chọn tạm khi đổi WiFi
  - id: sel_ssid
    type: std::string
    initial_value: '""'
  - id: sel_pw
    type: std::string
    initial_value: '""'

binary_sensor:
  - platform: status
    name: "Device Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid


# ----------------------------------------------------------------------------
#  Giao diện LVGL — 2 trang, chạm để chuyển
# ----------------------------------------------------------------------------
lvgl:
  on_idle:
    timeout: 10s
    then:
      # Đang ở trang Cài đặt / WiFi thì KHÔNG nhảy về màn chờ — người dùng có thể
      # đang đọc thông tin hoặc gõ mật khẩu, 10 giây là quá ngắn.
      - if:
          condition:
            not:
              or:
                - lvgl.page.is_showing: page_settings
                - lvgl.page.is_showing: page_wifi
          then:
            - lvgl.page.show: page_idle
  displays:
    - main_display
  touchscreens:
    - main_touch
  # KHÔNG xoay: panel CYD 2.8" là khổ dọc 240x320 (xoay bằng phần mềm làm chữ dựng đứng)
  bg_color: ${col_bg}

  style_definitions:
    - id: card
      bg_color: ${col_card}
      bg_opa: COVER
      radius: 12
      border_width: 0
      pad_all: 6
      text_color: ${col_text}
    - id: card_sm
      bg_color: ${col_card}
      bg_opa: COVER
      radius: 10
      border_width: 0
      pad_all: 5
      text_color: ${col_text}
    - id: topbar
      bg_color: ${col_card2}
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0

  pages:
    # ======================= TRANG 1: DONUT + POWER FLOW =======================
    - id: page_main
      bg_color: ${col_bg}
      widgets:
        # ---------- Donut PRODUCTION ----------
        - obj:
            x: 4
            y: 3
            width: 114
            height: 86
            radius: 10
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 0
            pad_all: 2
            widgets:
              - label:
                  text: "PRODUCTION"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - arc:
                  id: arc_prod
                  align: TOP_MID
                  y: 11
                  width: 52
                  height: 52
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_width: 7
                  arc_color: ${col_grid}
                  indicator:
                    arc_color: ${col_pv}
                    arc_width: 7
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: lbl_prod
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_16
                  align: TOP_MID
                  y: 25
              - label:
                  text: "kWh"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
                  y: 43
              - label:
                  id: lbl_prod_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        # ---------- Donut CONSUMPTION ----------
        - obj:
            x: 122
            y: 3
            width: 114
            height: 86
            radius: 10
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 0
            pad_all: 2
            widgets:
              - label:
                  text: "CONSUMPTION"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - arc:
                  id: arc_cons
                  align: TOP_MID
                  y: 11
                  width: 52
                  height: 52
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_width: 7
                  arc_color: ${col_load}
                  indicator:
                    arc_color: ${col_grid}
                    arc_width: 7
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: lbl_cons
                  text: "--"
                  text_color: ${col_text}
                  text_font: montserrat_16
                  align: TOP_MID
                  y: 25
              - label:
                  text: "kWh"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
                  y: 43
              - label:
                  id: lbl_cons_sub
                  text: "--"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        # ---------- TOTAL PV ----------
        - obj:
            id: box_pv
            x: 58
            y: 96
            width: 124
            height: 46
            radius: 8
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_pv}
            pad_all: 2
            widgets:
              - label:
                  text: "TOTAL PV"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: TOP_MID
              - label:
                  id: lbl_pv
                  text: "-- kW"
                  text_color: ${col_text}
                  text_font: montserrat_18
                  align: CENTER
                  y: 2
              - label:
                  id: lbl_mppt
                  text: "2 MPPT"
                  text_color: ${col_muted}
                  text_font: montserrat_10
                  align: BOTTOM_MID

        - label:
            id: lbl_pv12
            text: "PV1 -- W    PV2 -- W"
            text_color: ${col_pv}
            text_font: montserrat_10
            align: TOP_MID
            y: 144

        # ---------- duong noi doc PV -> inverter (dai de chay hoat hinh) ----------
        - obj:
            x: 119
            y: 158
            width: 2
            height: 20
            bg_color: ${col_card2}
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
        - obj:
            id: dot_pv
            x: 117
            y: 158
            width: 6
            height: 6
            radius: 3
            bg_color: ${col_pv}
            bg_opa: COVER
            border_width: 0
            pad_all: 0

        # ---------- BATTERY | Luxpower | HOME ----------
        - obj:
            id: box_batt
            x: 2
            y: 180
            width: 66
            height: 52
            radius: 8
            bg_color: ${col_card}
            bg_opa: COVER
            border_width: 2
            border_color: ${col_grid}
            pad_all: 2
            widgets:
              - label:
                  text: "BATTERY"
                  text_color: ${col_grid}
                  text_font: montserrat_10
                  align: TOP_MID
