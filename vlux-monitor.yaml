        - obj:
            styles: card_sm
            x: 10
            y: 100
            width: 220
            height: 56
            widgets:
              - label:
                  text: "DONGLE SN"
                  text_color: ${col_pv}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_dsn
                  text: "dang hoc..."
                  text_color: ${col_text}
                  text_font: montserrat_20
                  align: BOTTOM_RIGHT
        - obj:
            styles: card_sm
            x: 10
            y: 166
            width: 220
            height: 56
            widgets:
              - label:
                  text: "INVERTER SN"
                  text_color: ${col_batt}
                  text_font: montserrat_12
                  align: TOP_LEFT
              - label:
                  id: d_isn
                  text: "dang hoc..."
                  text_color: ${col_text}
                  text_font: montserrat_20
                  align: BOTTOM_RIGHT

        - label:
            id: d_wifi
            text: "WiFi: --"
            text_color: ${col_muted}
            text_font: montserrat_12
            align: TOP_LEFT
            x: 12
            y: 232
        - label:
            id: d_age
            text: "Du lieu: --"
            text_color: ${col_muted}
            text_font: montserrat_12
            align: TOP_LEFT
            x: 12
            y: 252

        - label:
            text: "3/3"
            text_color: ${col_muted}
            text_font: montserrat_12
            align: BOTTOM_MID
            y: -1

        - obj:
            x: 0
            y: 0
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: true
            on_click:
              - lvgl.page.next:


# Đồng hồ trên các trang
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          std::string s = t.is_valid() ? str_sprintf("%02d:%02d", t.hour, t.minute)
                                       : std::string("--:--");
          lv_label_set_text(id(lbl_clock), s.c_str());
          lv_label_set_text(id(lbl_clock2), s.c_str());
          lv_label_set_text(id(lbl_clock3), s.c_str());
          // tuổi dữ liệu -> biết ngay dongle có đang đẩy không
          if (id(last_data_ms) != 0) {
            uint32_t age = (millis() - id(last_data_ms)) / 1000;
            lv_label_set_text(id(d_age), str_sprintf("Du lieu: %u giay truoc",
                              (unsigned) age).c_str());
          }
